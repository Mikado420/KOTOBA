<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#FAF6EE" />
  <!-- Ring binder holes -->
  <circle cx="96" cy="120" r="16" fill="#D3C7B2" />
  <circle cx="96" cy="256" r="16" fill="#D3C7B2" />
  <circle cx="96" cy="392" r="16" fill="#D3C7B2" />
  <!-- Silver binder rings -->
  <path d="M72 120 C 50 120, 50 144, 72 144 L 120 144 C 142 144, 142 120, 120 120 Z" fill="#9CA3AF" opacity="0.8" />
  <path d="M72 256 C 50 256, 50 280, 72 280 L 120 280 C 142 280, 142 256, 120 256 Z" fill="#9CA3AF" opacity="0.8" />
  <path d="M72 392 C 50 392, 50 416, 72 416 L 120 416 C 142 416, 142 392, 120 392 Z" fill="#9CA3AF" opacity="0.8" />
  <!-- Paper card note -->
  <rect x="124" y="90" width="310" height="332" rx="16" fill="#FFFDF8" stroke="#E5DEC9" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.06))" />
  <!-- Ruled lines -->
  <line x1="150" y1="160" x2="400" y2="160" stroke="#F1EAD9" stroke-width="2" />
  <line x1="150" y1="220" x2="400" y2="220" stroke="#F1EAD9" stroke-width="2" />
  <line x1="150" y1="280" x2="400" y2="280" stroke="#F1EAD9" stroke-width="2" />
  <line x1="150" y1="340" x2="400" y2="340" stroke="#F1EAD9" stroke-width="2" />
  <!-- Vocabulary text -->
  <text x="160" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#2C2825">cherish</text>
  <text x="160" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#786F66">/ˈtʃerɪʃ/ [動]</text>
  <text x="160" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#E11D48">大切にする、心に抱く</text>
  <text x="160" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#524A42">cherish memories</text>
  <!-- Red sheet overlay -->
  <rect x="134" y="215" width="290" height="90" rx="12" fill="#E11D48" fill-opacity="0.82" transform="rotate(-4 279 260)" />
  <text x="320" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFF" fill-opacity="0.9" transform="rotate(-4 279 260)">赤シート</text>
</svg>